baseURL = "https://go-ruby-sass.github.io/"
title = "go-ruby-sass"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Pure Go, zero cgo"
  status = "ready"
  blurb = "`sass` builds with `CGO_ENABLED=0` — it cross-compiles to every Go target with no C toolchain and links into a single static binary. No `sass` binary, no `libsass`, no Dart VM."

[[params.phases]]
  name = "Dart-Sass-compatible output"
  status = "ready"
  blurb = "Compiles SCSS and indented Sass to CSS matching the observable behaviour of `dart-sass`, the reference implementation, via the pure-Go engine [go-scss/scss](https://github.com/go-scss/scss)."

[[params.phases]]
  name = "Both syntaxes"
  status = "ready"
  blurb = "Handles **SCSS** (`.scss`, brace-and-semicolon) and **indented Sass** (`.sass`, whitespace-significant) — `syntax:` selects either, mirroring `Sass.compile_string`."

[[params.phases]]
  name = "Two gem surfaces, one engine"
  status = "ready"
  blurb = "Exposes both the modern **`sass-embedded`** surface (`Sass.compile_string` / `Sass.compile`) and the legacy **`sassc`** surface (`SassC::Engine#render`) — bound into `rbgo` as `require \"sass\"`."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 10.02:1, bright on the dark background 4.00:1.
  base = "#7f1d1d"
  deep = "#4d1212"
  bright = "#dc2626"
  shadow = "rgba(127,29,29,.7)"
  glow = "rgba(127,29,29,.6)"
  wash = "rgba(127,29,29,.10)"
  washDeep = "rgba(77,18,18,.06)"
  chipBg = "#fbe5e5"
  chipBorder = "#f4bebe"
  chipFg = "#4d1212"
  chipBgDark = "rgba(220,38,38,.14)"
  chipBorderDark = "rgba(220,38,38,.32)"
  chipFgDark = "#ec8888"
  statsEnd = "#f7cbcb"
  bandText = "#f9dcdc"
